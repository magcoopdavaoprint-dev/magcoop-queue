<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Queue — MAGCOOP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0b3d91',
            magcoop: { blue: '#0b3d91', yellow: '#f5ce00', green: '#22c55e' }
          }
        }
      }
    }
  </script>
  <style>
    body { background: linear-gradient(135deg, #0b3d91 0%, #1e50b8 100%); min-height: 100vh; font-family: sans-serif; }
    .pulse-btn { animation: pulse 2s infinite; }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    .redirect-text { animation: blink 1s infinite; }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 text-center">
    <h1 class="text-3xl font-bold mb-6">
      <span class="text-magcoop-blue">MAG</span><span class="text-magcoop-yellow">COOP</span>
    </h1>
    <h2 class="text-xl font-semibold text-gray-700 mb-6">Join the Queue</h2>

    <!-- Form Section -->
    <div id="formSection">
      <label class="block text-left text-gray-600 font-medium mb-2">Your Full Name</label>
      <input 
        type="text" 
        id="fullName" 
        placeholder="Enter your name..." 
        class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-lg focus:border-magcoop-blue focus:outline-none"
        autocomplete="name"
      />

      <button 
        id="submitBtn" 
        class="w-full bg-magcoop-green hover:bg-green-600 text-white text-lg font-bold py-3 rounded-xl transition pulse-btn mt-6"
      >
        ✅ Submit to Queue
      </button>
      
      <p id="statusText" class="mt-3 text-xs text-gray-400">Ready</p>
    </div>

    <!-- Success Section -->
    <div id="successSection" class="hidden">
      <div class="text-6xl mb-4">✅</div>
      <h3 class="text-2xl font-bold text-green-600 mb-2">YOU'RE IN THE QUEUE!</h3>
      <p class="text-lg text-gray-700 mb-1">Token: <span id="showToken" class="font-bold text-magcoop-blue"></span></p>
      <p class="text-lg text-gray-700 mb-4">Name: <span id="showName" class="font-bold uppercase"></span></p>
      <p class="text-sm text-gray-500">
        Going to Queue Display in <span id="countdown">5</span> seconds...
      </p>
      <a href="public-display.html" class="inline-block mt-4 text-magcoop-blue hover:underline font-medium">
        📋 View Queue List Now →
      </a>
    </div>

    <a href="public-display.html" class="inline-block mt-6 text-magcoop-blue hover:underline text-sm">
      ← Back to Main Display
    </a>
  </div>

  <script>
    // ✅ DECLARED ONLY ONCE — No duplicate!
    const SUPABASE_URL = "https://jvyrnzlrklydeaevjqry.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2eXJuemxya2x5ZGVhZXZqcXJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTUzNzIsImV4cCI6MjEwNTUzMTM3Mn0.vqIiba18j22PrMy-ye6OuzBSbngwWF-TPfo3JRPGI3E";

    // ✅ ONE initialization only
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    const nameInput = document.getElementById('fullName');
    const submitBtn = document.getElementById('submitBtn');
    const formSection = document.getElementById('formSection');
    const successSection = document.getElementById('successSection');
    const showToken = document.getElementById('showToken');
    const showName = document.getElementById('showName');
    const countdownEl = document.getElementById('countdown');
    const statusText = document.getElementById('statusText');

    // Auto-fill from QR link
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const nameFromLink = params.get('name');
      if (nameFromLink) {
        nameInput.value = decodeURIComponent(nameFromLink);
        statusText.textContent = 'Name from QR link';
      }
      nameInput.focus();
    });

    // Get Next Token
    async function getNextToken() {
      const [{ data: q }, { data: c }] = await Promise.all([
        sb.from('queue').select('token'),
        sb.from('calls').select('token')
      ]);
      
      let maxNum = 0;
      [...(q||[]), ...(c||[])].forEach(row => {
        const num = parseInt(row.token?.replace('MAG-', ''), 10);
        if (!isNaN(num) && num > maxNum) maxNum = num;
      });
      return `MAG-${maxNum + 1}`;
    }

    // Submit Function
    async function submitToQueue() {
      const name = nameInput.value.trim();
      
      if (!name) {
        statusText.textContent = '⚠️ Enter your name first!';
        statusText.style.color = '#ea580c';
        nameInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      statusText.textContent = 'Saving...';
      statusText.style.color = 'inherit';

      try {
        const token = await getNextToken();
        const { count } = await sb.from('queue').select('*', { count: 'exact', head: true });
        
        const { error } = await sb.from('queue').insert({
          token,
          name: name,
          service: 'General Inquiry',
          dept: 'Customer Service',
          position: (count || 0) + 1
        });

        if (error) throw error;

        // Success
        showToken.textContent = token;
        showName.textContent = name.toUpperCase();
        formSection.classList.add('hidden');
        successSection.classList.remove('hidden');

        // Auto-redirect
        let seconds = 5;
        const timer = setInterval(() => {
          seconds--;
          countdownEl.textContent = seconds;
          if (seconds <= 0) {
            clearInterval(timer);
            window.location.href = 'public-display.html';
          }
        }, 1000);

      } catch (err) {
        statusText.textContent = '❌ ' + err.message;
        statusText.style.color = '#ef4444';
        submitBtn.disabled = false;
        submitBtn.textContent = '✅ Submit to Queue';
      }
    }

    // Click & Enter handlers
    submitBtn.addEventListener('click', submitToQueue);
    nameInput.addEventListener('keydown', e => e.key === 'Enter' && submitToQueue());
  </script>
</body>
</html>
