<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Queue — MAGCOOP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0b3d91',
            magcoop: { 
              blue: '#0b3d91', 
              yellow: '#f5ce00', 
              green: '#22c55e',
              loan: '#8b5cf6',
              loandark: '#7c3aed'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* ✅ Matches Loan Counter background exactly */
    body { 
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); 
      min-height: 100vh; 
      font-family: sans-serif; 
    }
    .pulse-btn { animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); }
      50% { transform: scale(1.03); box-shadow: 0 0 20px 10px rgba(139, 92, 246, 0.2); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); }
    }
    .option-card { transition: all 0.2s ease; cursor: pointer; }
    .option-card.selected { border-color: #8b5cf6; background: #f5f3ff; }
    .option-card:hover { transform: translateY(-2px); }
    .input-error { border-color: #ef4444 !important; background: #fef2f2; }
  </style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 text-center">
    <h1 class="text-3xl font-bold mb-6">
      <span class="text-magcoop-loan">💰 MAGCOOP</span>
    </h1>
    <h2 class="text-xl font-semibold text-gray-700 mb-6">Join the Queue</h2>
    
    <!-- Form Section -->
    <div id="formSection">
      <label class="block text-left text-gray-600 font-medium mb-2">
        Your Nickname Only
        <span class="text-red-500 text-sm ml-1">(No spaces — One name only)</span>
      </label>
      <input 
        type="text" 
        id="nicknameInput" 
        placeholder="e.g. Roland, not Roland Pogi" 
        class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-lg focus:border-magcoop-loan focus:outline-none"
        autocomplete="nickname"
      />
      
      <label class="block text-left text-gray-600 font-medium mt-5 mb-3">Select Service Type</label>
      
      <!-- Service Options -->
      <div class="grid grid-cols-1 gap-3 mb-6">
        <div id="optGeneral" class="option-card border-2 border-gray-200 rounded-xl p-4 text-left selected">
          <div class="flex items-center gap-3">
            <span class="text-xl">📋</span>
            <div>
              <p class="font-semibold text-gray-800">Encoding</p>
              <p class="text-xs text-gray-500">Visa, Forms, Printing, Uniform</p>
            </div>
            <span class="ml-auto text-magcoop-loan font-bold" id="checkGeneral">✓</span>
          </div>
        </div>
        
        <div id="optLoan" class="option-card border-2 border-gray-200 rounded-xl p-4 text-left">
          <div class="flex items-center gap-3">
            <span class="text-xl">💰</span>
            <div>
              <p class="font-semibold text-gray-800">MAGCOOP Loan</p>
              <p class="text-xs text-gray-500">Loan application & processing</p>
            </div>
            <span class="ml-auto text-magcoop-loan font-bold hidden" id="checkLoan">✓</span>
          </div>
        </div>
      </div>
      
      <button 
        id="submitBtn" 
        class="w-full bg-magcoop-loan hover:bg-magcoop-loandark text-white text-lg font-bold py-3 rounded-xl transition pulse-btn"
      >
        ✅ Submit to Queue
      </button>
      
      <p id="statusText" class="mt-3 text-xs text-gray-400">Enter nickname — no spaces please</p>
    </div>
    
    <!-- Success Section -->
    <div id="successSection" class="hidden">
      <div class="text-6xl mb-4">✅</div>
      <h3 class="text-2xl font-bold text-magcoop-loan mb-2">YOU'RE IN THE QUEUE!</h3>
      <p class="text-lg text-gray-700 mb-1">Token: <span id="showToken" class="font-bold text-magcoop-loan"></span></p>
      <p class="text-lg text-gray-700 mb-1">Name: <span id="showName" class="font-bold uppercase"></span></p>
      <p class="text-md text-gray-600 mb-4">Service: <span id="showService" class="font-semibold"></span></p>
      <p class="text-sm text-gray-500 mb-3">
        Auto-closing in <span id="countdown">5</span> seconds...
      </p>
      <a href="public-display.html" class="inline-block mt-2 text-magcoop-loan hover:underline font-medium">
        📋 View Queue List Now →
      </a>
    </div>
  </div>
  <script>
    const SUPABASE_URL = "https://jvyrnzlrklydeaevjqry.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2eXJuemxya2x5ZGVhZXZqcXJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTUzNzIsImV4cCI6MjEwNTUzMTM3Mn0.vqIiba18j22PrMy-ye6OuzBSbngwWF-TPfo3JRPGI3E";
    
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const nicknameInput = document.getElementById('nicknameInput');
    const submitBtn = document.getElementById('submitBtn');
    const formSection = document.getElementById('formSection');
    const successSection = document.getElementById('successSection');
    const showToken = document.getElementById('showToken');
    const showName = document.getElementById('showName');
    const showService = document.getElementById('showService');
    const countdownEl = document.getElementById('countdown');
    const statusText = document.getElementById('statusText');
    
    const optGeneral = document.getElementById('optGeneral');
    const optLoan = document.getElementById('optLoan');
    const checkGeneral = document.getElementById('checkGeneral');
    const checkLoan = document.getElementById('checkLoan');
    
    let selectedService = 'Encoding';
    let selectedDept = 'Customer Service';
    
    // === Service Selection ===
    function selectService(type) {
      optGeneral.classList.remove('selected');
      optLoan.classList.remove('selected');
      checkGeneral.classList.add('hidden');
      checkLoan.classList.add('hidden');
      
      if (type === 'general') {
        optGeneral.classList.add('selected');
        checkGeneral.classList.remove('hidden');
        selectedService = 'Encoding';
        selectedDept = 'Customer Service';
      } else {
        optLoan.classList.add('selected');
        checkLoan.classList.remove('hidden');
        selectedService = 'MAGCOOP Loan';
        selectedDept = 'Loans';
      }
    }
    
    optGeneral.addEventListener('click', () => selectService('general'));
    optLoan.addEventListener('click', () => selectService('loan'));
    
    // === Block spaces as user types ===
    nicknameInput.addEventListener('input', () => {
      const val = nicknameInput.value;
      if (/\s/.test(val)) {
        nicknameInput.value = val.replace(/\s+/g, '');
        statusText.textContent = '⚠️ Spaces not allowed — use one nickname only';
        statusText.style.color = '#ea580c';
        nicknameInput.classList.add('input-error');
        setTimeout(() => {
          nicknameInput.classList.remove('input-error');
        }, 1500);
      } else {
        statusText.textContent = 'Looks good ✅';
        statusText.style.color = '#22c55e';
      }
    });
    
    // === Pre-fill from QR link ===
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const nameFromLink = params.get('name');
      const serviceFromLink = params.get('service');
      
      if (nameFromLink) {
        const cleaned = decodeURIComponent(nameFromLink).replace(/\s+/g, '');
        nicknameInput.value = cleaned;
        statusText.textContent = 'Name loaded & cleaned ✅';
        statusText.style.color = '#22c55e';
      }
      
      if (serviceFromLink === 'loan') {
        selectService('loan');
      } else {
        selectService('general');
      }
      
      nicknameInput.focus();
    });
    
    // === Get Next Token ===
    async function getNextToken() {
      const [{ data: q }, { data: c }] = await Promise.all([
        sb.from('queue').select('token'),
        sb.from('calls').select('token')
      ]);
      
      let maxNum = 0;
      [...(q||[]), ...(c||[])].forEach(row => {
        let num;
        if (row.token?.startsWith('E') || row.token?.startsWith('L')) {
          num = parseInt(row.token.slice(1), 10);
        } else {
          num = parseInt(row.token?.replace(/^.*-/, ''), 10);
        }
        if (!isNaN(num) && num > maxNum) maxNum = num;
      });
      
      if (selectedService === 'MAGCOOP Loan') {
        return `L${String(maxNum + 1).padStart(3, '0')}`;
      } else {
        return `E${String(maxNum + 1).padStart(3, '0')}`;
      }
    }
    
    // === Submit Validation ===
    async function submitToQueue() {
      let nickname = nicknameInput.value.trim();
      
      if (/\s/.test(nickname)) {
        statusText.textContent = '❌ Spaces not allowed! Enter one nickname only';
        statusText.style.color = '#ef4444';
        nicknameInput.classList.add('input-error');
        nicknameInput.focus();
        return;
      }
      
      if (!nickname) {
        statusText.textContent = '⚠️ Enter your nickname first!';
        statusText.style.color = '#ea580c';
        nicknameInput.focus();
        return;
      }
      
      if (nickname.length > 20) {
        statusText.textContent = '❌ Nickname too long — keep it short';
        statusText.style.color = '#ef4444';
        return;
      }
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      statusText.textContent = 'Saving...';
      statusText.style.color = 'inherit';
      
      try {
        const token = await getNextToken();
        const { count } = await sb.from('queue').select('*', { count: 'exact', head: true });
        
        const { error } = await sb.from('queue').insert({
          token,
          name: nickname,
          service: selectedService,
          dept: selectedDept,
          position: (count || 0) + 1
        });
        
        if (error) throw error;
        
        showToken.textContent = token;
        showName.textContent = nickname.toUpperCase();
        showService.textContent = selectedService;
        formSection.classList.add('hidden');
        successSection.classList.remove('hidden');
        
        let seconds = 5;
        const timer = setInterval(() => {
          seconds--;
          countdownEl.textContent = seconds;
          
          if (seconds <= 0) {
            clearInterval(timer);
            window.close();
            if (!window.closed) {
              window.location.replace('public-display.html');
            }
          }
        }, 1000);
        
      } catch (err) {
        statusText.textContent = '❌ ' + err.message;
        statusText.style.color = '#ef4444';
        submitBtn.disabled = false;
        submitBtn.textContent = '✅ Submit to Queue';
      }
    }
    
    submitBtn.addEventListener('click', submitToQueue);
    nicknameInput.addEventListener('keydown', e => e.key === 'Enter' && submitToQueue());
  </script>
</body>
</html>
