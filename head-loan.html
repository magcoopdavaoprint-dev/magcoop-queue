<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan Counter — MAGCOOP DAVAO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { magcoop: { loan: '#8b5cf6', loandark: '#7c3aed' } }
        }
      }
    }
  </script>
  <style>
    body { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); min-height: 100vh; font-family: sans-serif; }
    .calling { animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); }
      50% { transform: scale(1.03); box-shadow: 0 0 20px 10px rgba(139, 92, 246, 0.2); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); }
    }
    .queue-row-new { animation: highlightFade 2s ease; }
    @keyframes highlightFade {
      0% { background-color: #fef3c7; }
      100% { background-color: transparent; }
    }
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-6xl mx-auto">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-white mb-2">💰 MAGCOOP — LOAN COUNTER</h1>
      <p class="text-indigo-200">Davao Branch · Loan Processing Only</p>
      <p class="text-sm mt-2" id="connStatus">Checking connection...</p>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-8 mb-8 text-center" id="servingCard">
      <h2 class="text-7xl font-bold text-magcoop-loan mb-4" id="currentToken">—</h2>
      <p class="text-3xl text-gray-700 font-semibold" id="currentName">Waiting for next loan...</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 bg-white rounded-2xl shadow-xl p-6">
        <h3 class="text-xl font-bold text-gray-800 mb-4">📋 Loan Queue List</h3>
        <table class="w-full text-sm">
          <thead>
            <tr class="text-gray-500 border-b-2 border-indigo-100">
              <th class="py-3 text-left w-12">#</th>
              <th class="py-3 text-left">Token</th>
              <th class="py-3 text-left">Name</th>
              <th class="py-3 text-center w-24">Action</th>
            </tr>
          </thead>
          <tbody id="loanQueueBody">
            <tr><td colspan="4" class="py-8 text-center text-gray-400">No loan applications in queue</td></tr>
          </tbody>
        </table>
      </div>

      <div class="bg-white rounded-2xl shadow-xl p-6">
        <h3 class="text-xl font-bold text-gray-800 mb-4">⚙️ Loan Controls</h3>
        <p class="text-xs text-indigo-500 mb-1">WAITING</p>
        <p class="text-3xl font-bold text-magcoop-loan mb-6" id="waitingCount">0</p>

        <button id="addLoanBtn" class="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-3 rounded-xl mb-4">
          ➕ Add Loan Applicant
        </button>
        <button id="callNextBtn" class="w-full bg-magcoop-loan hover:bg-magcoop-loandark text-white text-lg font-bold py-4 rounded-xl transition mb-4">
          📢 CALL NEXT LOAN
        </button>
        <button id="clearDisplayBtn" class="w-full bg-amber-50 hover:bg-amber-100 text-amber-700 font-medium py-3 rounded-xl transition mb-4">
          🔄 CLEAR CURRENT DISPLAY
        </button>
        <button id="resetLoanBtn" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-medium py-2 rounded-xl transition text-sm">
          🗑️ Reset All Loan Queue
        </button>
      </div>
    </div>
  </div>

  <div id="addLoanModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 w-full max-w-md mx-4">
      <h3 class="text-lg font-bold mb-4">Add Loan Applicant</h3>
      <input type="text" id="loanName" placeholder="Full Name" class="w-full border rounded-lg px-3 py-2 mb-3" />
      <div class="flex gap-3 mt-5">
        <button id="cancelLoanBtn" class="flex-1 py-2 border rounded-lg">Cancel</button>
        <button id="saveLoanBtn" class="flex-1 py-2 bg-purple-600 text-white rounded-lg">Add to Queue</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://jvyrnzlrklydeaevjqry.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2eXJuemxya2x5ZGVhZXZqcXJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTUzNzIsImV4cCI6MjEwNTUzMTM3Mn0.vqIiba18j22PrMy-ye6OuzBSbngwWF-TPfo3JRPGI3E";
    
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentServing = null;
    let loanQueue = [];
    let tokenOffset = 0;
    let latestKnownId = 0;

    const currentTokenEl = document.getElementById('currentToken');
    const currentNameEl = document.getElementById('currentName');
    const loanQueueBody = document.getElementById('loanQueueBody');
    const waitingCountEl = document.getElementById('waitingCount');
    const callNextBtn = document.getElementById('callNextBtn');
    const clearDisplayBtn = document.getElementById('clearDisplayBtn');
    const resetLoanBtn = document.getElementById('resetLoanBtn');
    const servingCard = document.getElementById('servingCard');
    const addLoanBtn = document.getElementById('addLoanBtn');
    const addLoanModal = document.getElementById('addLoanModal');
    const loanNameInput = document.getElementById('loanName');
    const cancelLoanBtn = document.getElementById('cancelLoanBtn');
    const saveLoanBtn = document.getElementById('saveLoanBtn');
    const connStatus = document.getElementById('connStatus');

    (async () => {
      try {
        await sb.from("queue").select("*").limit(1);
        connStatus.textContent = "✅ LIVE — Auto-updating";
        connStatus.style.color = "#86efac";
      } catch (e) {
        connStatus.textContent = "❌ OFFLINE — Check Internet";
        connStatus.style.color = "#fca5a5";
      }
    })();

    addLoanBtn.addEventListener('click', () => {
      addLoanModal.classList.remove('hidden');
      addLoanModal.classList.add('flex');
      loanNameInput.value = '';
      loanNameInput.focus();
    });
    cancelLoanBtn.addEventListener('click', () => {
      addLoanModal.classList.add('hidden');
      addLoanModal.classList.remove('flex');
    });
    saveLoanBtn.addEventListener('click', async () => {
      const name = loanNameInput.value.trim();
      if (!name) return alert('Enter name');
      
      const [{ data: q }, { data: c }] = await Promise.all([
        sb.from("queue").select("token").eq("service", "MAGCOOP Loan"),
        sb.from("calls").select("token").eq("service", "MAGCOOP Loan")
      ]);
      let max = 0;
      [...(q||[]), ...(c||[])].forEach(r => {
        const num = parseInt(r.token.replace("MAG-", ""), 10);
        if (!isNaN(num) && num > max) max = num;
      });
      const nextNum = tokenOffset > 0 ? tokenOffset : (max + 1);
      if (tokenOffset > 0) tokenOffset = 0;
      const token = `MAG-${nextNum}`;
      
      const { count } = await sb.from("queue").select("*", { count: "exact", head: true }).eq("service", "MAGCOOP Loan");
      await sb.from("queue").insert({
        token, name, dept: "Loans", service: "MAGCOOP Loan", position: (count || 0) + 1
      });
      
      addLoanModal.classList.add('hidden');
      addLoanModal.classList.remove('flex');
    });

    window.addEventListener('DOMContentLoaded', loadLoanQueue);

    async function loadLoanQueue() {
      const { data } = await sb.from('queue').select('*').eq('service', 'MAGCOOP Loan').order('position', { ascending: true });
      loanQueue = data || [];
      waitingCountEl.textContent = loanQueue.length;
      
      if (loanQueue.length > 0) {
        latestKnownId = Math.max(...loanQueue.map(i => i.id || 0));
      }
      
      renderLoanQueue();
      callNextBtn.disabled = loanQueue.length === 0;
    }

    function renderLoanQueue() {
      if (loanQueue.length === 0) {
        loanQueueBody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-gray-400">No loan applications in queue</td></tr>`;
        return;
      }
      loanQueueBody.innerHTML = loanQueue.map((item, idx) => {
        const isNew = item.id && latestKnownId && item.id === latestKnownId;
        return `
          <tr class="border-b hover:bg-indigo-50 ${isNew ? 'queue-row-new' : ''}">
            <td class="py-3 font-bold text-magcoop-loan">${idx + 1}</td>
            <td class="py-3 font-mono">${item.token}</td>
            <td class="py-3">${item.name}</td>
            <td class="py-3 text-center">
              <button data-id="${item.id}" class="remove-btn text-red-400 hover:text-red-600">✕</button>
            </td>
          </tr>
        `;
      }).join('');
      
      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if(confirm('Remove this loan applicant?')) {
            await sb.from('queue').delete().eq('id', btn.dataset.id);
          }
        });
      });
    }

    // ✅ FIXED: CALL NEXT — REMOVE FROM LIST INSTANTLY
    callNextBtn.addEventListener('click', async () => {
      if (loanQueue.length === 0) { alert('No loan customers in queue!'); return; }
      
      // Take the first person from LOCAL list first (fast UI update)
      const next = loanQueue[0];
      
      // 🟢 IMMEDIATELY remove from local list — user sees it gone instantly
      loanQueue.shift();
      waitingCountEl.textContent = loanQueue.length;
      renderLoanQueue();
      callNextBtn.disabled = loanQueue.length === 0;
      
      // Send to Public Display
      await sb.from('calls').delete().eq('service', 'MAGCOOP Loan');
      
      setTimeout(async () => {
        await sb.from('calls').insert({
          token: next.token,
          name: next.name,
          service: 'MAGCOOP Loan',
          counter: 2,
          status: 'serving'
        });
      }, 100);

      // Delete from database in background
      await sb.from('queue').delete().eq('id', next.id);

      // Update serving display
      currentServing = next;
      currentTokenEl.textContent = next.token;
      currentNameEl.textContent = next.name.toUpperCase();
      servingCard.classList.add('calling');
      setTimeout(() => servingCard.classList.remove('calling'), 3000);
    });

    clearDisplayBtn.addEventListener('click', async () => {
      if (!confirm('Clear current display on TV?')) return;
      await sb.from('calls').delete().eq('service', 'MAGCOOP Loan');
      currentServing = null;
      currentTokenEl.textContent = '—';
      currentNameEl.textContent = 'Waiting for next loan...';
      alert('✅ Display Cleared');
    });

    resetLoanBtn.addEventListener('click', async () => {
      if (!confirm('⚠️ RESET ALL LOAN DATA?\n\nClear queue + clear display\nNext = MAG-1')) return;
      await sb.from('queue').delete().eq('service', 'MAGCOOP Loan');
      await sb.from('calls').delete().eq('service', 'MAGCOOP Loan');
      currentServing = null;
      currentTokenEl.textContent = '—';
      currentNameEl.textContent = 'Waiting for next loan...';
      tokenOffset = 1;
      alert('✅ Reset Complete — Next will be MAG-1');
    });

    // 🔴 LIVE REAL-TIME — catches new additions from join form
    sb.channel('loan-queue-live')
      .on('postgres_changes', { 
        event: '*', 
        schema: 'public', 
        table: 'queue', 
        filter: 'service=eq.MAGCOOP Loan' 
      }, () => {
        loadLoanQueue();
      })
      .subscribe();
  </script>
</body>
</html>
