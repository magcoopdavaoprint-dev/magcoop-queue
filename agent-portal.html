<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Portal — MAGCOOP DAVAO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563eb',
            secondary: '#e0e7ff',
            danger: '#fee2e2',
            dangerText: '#dc2626',
            lightBg: '#f8fafc',
            borderColor: '#f1f5f9'
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #ffffff; color: #1e293b; }
    .card { background: #fff; border-radius: 12px; border: 1px solid #f1f5f9; padding: 1.25rem; }
    .collapse-content { overflow: hidden; max-height: 0; transition: max-height 0.3s ease; }
    .collapse-content.open { max-height: 400px; }
  </style>
</head>
<body class="p-6">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <h1 class="text-2xl font-bold mb-2">Agent Portal — MAGCOOP DAVAO</h1>
    <p class="text-green-600 text-sm mb-6 flex items-center gap-2">
      <span>✅</span> Connected to Supabase
    </p>

    <!-- Top Row: Recently Served | Quick Stats | Quick Actions -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6">
      
      <!-- ✅ RECENTLY SERVED — Same Box, Same Position -->
      <div class="card">
        <button id="recentToggle" class="w-full flex items-center justify-between text-left text-gray-700 font-medium">
          <span class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
            Recently Served
          </span>
          <span id="toggleIcon" class="text-gray-400 text-sm">▼</span>
        </button>
        <div id="recentContent" class="collapse-content">
          <div id="recentList" class="mt-3 text-center text-gray-400 text-sm">
            None yet
          </div>
        </div>
      </div>

      <!-- Quick Stats -->
      <div class="card">
        <h3 class="font-semibold text-gray-700 mb-3">Quick Stats</h3>
        <p class="text-center">
          <span class="text-3xl font-bold">0</span>
          <span class="block text-xs text-gray-400 mt-1">Waiting</span>
        </p>
      </div>

      <!-- Quick Actions -->
      <div class="card">
        <h3 class="font-semibold text-gray-700 mb-3">Quick Actions</h3>
        <div class="grid grid-cols-2 gap-3">
          <button class="bg-primary text-white py-2 px-3 rounded-lg text-sm font-medium hover:bg-primary/90">Add Customer</button>
          <button class="bg-lightBg border border-gray-200 py-2 px-3 rounded-lg text-sm font-medium hover:bg-gray-50">Public Display</button>
        </div>
      </div>
    </div>

    <!-- Bottom Row: Counter Selection | Queue List -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      
      <!-- Counter Selection -->
      <div class="card">
        <h3 class="font-semibold text-gray-700 mb-3">Counter Selection</h3>
        <p class="text-sm text-gray-400 mb-3">Choose where customer goes</p>
        <div class="grid grid-cols-2 gap-3 mb-6">
          <button id="counter1" class="bg-primary text-white py-3 rounded-lg font-semibold">Counter 1</button>
          <button id="counter2" class="bg-gray-100 py-3 rounded-lg font-semibold">Counter 2</button>
        </div>
        
        <div class="bg-lightBg rounded-lg p-4 mb-4">
          <p class="text-xs text-gray-400 mb-1">CURRENTLY SERVING</p>
          <p class="text-lg font-bold" id="currentlyServing">—</p>
        </div>
        
        <button id="callNextBtn" class="w-full bg-secondary text-blue-700 py-3 rounded-lg font-semibold mb-3 hover:bg-indigo-100">
          ➔ CALL NEXT CUSTOMER
        </button>
        <button id="resetBtn" class="w-full bg-danger text-dangerText py-3 rounded-lg font-semibold hover:bg-red-100">
          ⟲ RESET QUEUE — Start from MAG-1
        </button>
      </div>

      <!-- Queue List -->
      <div class="card">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold text-gray-700">Queue List</h3>
          <button id="clearAllBtn" class="text-sm text-gray-400 hover:text-red-500">Clear All</button>
        </div>
        <div class="grid grid-cols-12 text-xs text-gray-400 py-2 border-b border-gray-100 font-medium">
          <span class="col-span-1">#</span>
          <span class="col-span-3">Token</span>
          <span class="col-span-4">Name</span>
          <span class="col-span-4">Service</span>
        </div>
        <div id="queueList" class="mt-2">
          <p class="text-gray-400 text-center py-6 text-sm">No customers in queue</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://jvyrnzlrklydeaevjqry.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2eXJuemxya2x5ZGVhZXZqcXJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTUzNzIsImV4cCI6MjEwNTUzMTM3Mn0.vqIiba18j22PrMy-ye6OuzBSbngwWF-TPfo3JRPGI3E";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const recentToggle = document.getElementById('recentToggle');
    const recentContent = document.getElementById('recentContent');
    const toggleIcon = document.getElementById('toggleIcon');
    const recentList = document.getElementById('recentList');
    const currentlyServing = document.getElementById('currentlyServing');
    const queueList = document.getElementById('queueList');
    const callNextBtn = document.getElementById('callNextBtn');
    const resetBtn = document.getElementById('resetBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const counter1 = document.getElementById('counter1');
    const counter2 = document.getElementById('counter2');

    let selectedCounter = 1;
    let isLoading = false;

    // Toggle Recently Served
    recentToggle.addEventListener('click', () => {
      recentContent.classList.toggle('open');
      toggleIcon.textContent = recentContent.classList.contains('open') ? '▲' : '▼';
    });

    // Counter selection
    counter1.addEventListener('click', () => {
      selectedCounter = 1;
      counter1.className = 'bg-primary text-white py-3 rounded-lg font-semibold';
      counter2.className = 'bg-gray-100 py-3 rounded-lg font-semibold';
    });
    counter2.addEventListener('click', () => {
      selectedCounter = 2;
      counter2.className = 'bg-primary text-white py-3 rounded-lg font-semibold';
      counter1.className = 'bg-gray-100 py-3 rounded-lg font-semibold';
    });

    // Refresh all data
    async function refreshAll() {
      if (isLoading) return;
      isLoading = true;
      
      try {
        const { data: queue } = await sb.from('queue').select('*').order('position', { ascending: true });
        const { data: serving } = await sb.from('calls').select('*').eq('status', 'serving').limit(1);
        const { data: recent } = await sb.from('calls').select('*').eq('status', 'finished').order('created_at', { ascending: false }).limit(10);

        // Currently Serving
        if (serving?.length) {
          currentlyServing.textContent = `${serving[0].token} — ${serving[0].counter || 1}`;
        } else {
          currentlyServing.textContent = '—';
        }

        // Queue List
        if (queue?.length) {
          queueList.innerHTML = queue.map((item, idx) => `
            <div class="grid grid-cols-12 py-2 border-b border-gray-50 text-sm items-center">
              <span class="col-span-1 text-gray-400">${idx + 1}</span>
              <span class="col-span-3 font-medium">${item.token}</span>
              <span class="col-span-4 text-gray-600">${item.name || '-'}</span>
              <span class="col-span-4 text-gray-400 text-xs">${item.service || '-'}</span>
            </div>
          `).join('');
        } else {
          queueList.innerHTML = '<p class="text-gray-400 text-center py-6 text-sm">No customers in queue</p>';
        }

        // Recently Served
        if (recent?.length) {
          recentList.innerHTML = recent.map(item => `
            <div class="py-2 border-b border-gray-50 text-sm">
              <span class="font-medium">${item.token}</span>
              <span class="text-gray-600 mx-2">${(item.name || '')}</span>
              <span class="text-gray-400 text-xs">Counter ${item.counter || 1}</span>
            </div>
          `).join('');
        } else {
          recentList.innerHTML = '<p class="text-gray-400 py-3">None yet</p>';
        }
      } catch (e) {
        console.error('Load error:', e);
      }
      
      isLoading = false;
    }

    // Call Next
    callNextBtn.addEventListener('click', async () => {
      if (isLoading) return;
      const { data: queue } = await sb.from('queue').select('*').order('position', { ascending: true }).limit(1);
      if (!queue?.length) return alert('No customers in queue!');

      const next = queue[0];
      
      // Finish current if any
      const { data: curr } = await sb.from('calls').select('*').eq('status', 'serving').limit(1);
      if (curr?.length) {
        await sb.from('calls').update({ status: 'finished' }).eq('id', curr[0].id);
      }

      // Start serving next
      await sb.from('calls').insert({
        token: next.token,
        name: next.name,
        counter: selectedCounter,
        status: 'serving'
      });

      // Remove from queue
      await sb.from('queue').delete().eq('id', next.id);
      
      await refreshAll();
    });

    // Reset Queue
    resetBtn.addEventListener('click', async () => {
      if (!confirm('Reset entire queue? This cannot be undone.')) return;
      await sb.from('queue').delete().neq('id', '00000000-0000-0000-0000-000000000000');
      await sb.from('calls').delete().neq('id', '00000000-0000-0000-0000-000000000000');
      await refreshAll();
    });

    // Clear All
    clearAllBtn.addEventListener('click', async () => {
      if (!confirm('Remove ALL customers from queue?')) return;
      await sb.from('queue').delete().neq('id', '00000000-0000-0000-0000-000000000000');
      await refreshAll();
    });

    // Real-time updates
    sb.channel('agent')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'queue' }, refreshAll)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'calls' }, refreshAll)
      .subscribe();

    refreshAll();
  </script>
</body>
</html>
