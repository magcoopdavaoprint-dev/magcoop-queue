<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Portal — MAGCOOP DAVAO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#2563eb' }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #fcfcfd; }
    .btn { cursor: pointer; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .token-badge { background: #ecfdf3; color: #065f46; font-family: monospace; font-weight: 600; padding: 4px 10px; border-radius: 6px; }
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      display: none; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .modal-overlay.active { display: flex; }
    .counter-btn { transition: all 0.2s ease; }
    .counter-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
    .served-item { border-bottom: 1px solid #f1f5f9; padding: 6px 0; }
    .served-item:last-child { border-bottom: none; }
  </style>
</head>
<body class="text-slate-800 min-h-screen p-6">
  <div class="max-w-7xl mx-auto">
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-slate-900">Agent Portal — MAGCOOP DAVAO</h1>
      <p class="text-sm mt-1" id="connStatus">Checking connection...</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-12 gap-5 mb-6">
      <!-- ✅ UPDATED: RECENTLY SERVED -->
      <div class="md:col-span-4 bg-white rounded-xl p-5 shadow-sm border border-slate-100">
        <p class="text-sm text-slate-500 mb-3"><i class="fa-regular fa-clock"></i> Recently Served</p>
        <div id="recentlyServedList" class="max-h-48 overflow-y-auto">
          <p class="text-slate-400 text-sm py-4 text-center">No one served yet</p>
        </div>
      </div>
      <div class="md:col-span-4 bg-white rounded-xl p-5 shadow-sm border border-slate-100">
        <h3 class="font-semibold text-slate-700 mb-4">Quick Stats</h3>
        <div class="text-center">
          <p class="text-3xl font-bold" id="waitingCount">0</p>
          <p class="text-xs text-slate-500">Waiting</p>
        </div>
      </div>
      <div class="md:col-span-4 bg-white rounded-xl p-5 shadow-sm border border-slate-100">
        <h3 class="font-semibold text-slate-700 mb-3">Quick Actions</h3>
        <div class="grid grid-cols-2 gap-2">
          <button id="addCustomerBtn" class="btn bg-slate-50 hover:bg-slate-100 rounded-lg p-3 text-sm flex flex-col items-center gap-1">
            <i class="fa-solid fa-user-plus"></i> Add Customer
          </button>
          <button onclick="window.open('public-display.html', '_blank')" class="btn bg-slate-50 hover:bg-slate-100 rounded-lg p-3 text-sm flex flex-col items-center gap-1">
            <i class="fa-solid fa-desktop"></i> Public Display
          </button>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-100">
        <h3 class="font-semibold text-lg mb-2">Counter Selection</h3>
        <p class="text-sm text-slate-500 mb-4">Choose where customer goes</p>
        
        <div class="grid grid-cols-2 gap-3 mb-4">
          <button id="btnCounter1" class="counter-btn active py-3 rounded-lg font-semibold border-2 border-blue-600">
            Counter 1
          </button>
          <button id="btnCounter2" class="counter-btn bg-slate-50 py-3 rounded-lg font-semibold border-2 border-slate-200">
            Counter 2
          </button>
        </div>
        <div class="bg-slate-50 rounded-lg p-4 mb-4">
          <p class="text-xs text-slate-400 uppercase mb-2">Currently Serving</p>
          <p class="text-lg font-semibold" id="nowServing">None</p>
        </div>
        <button id="callNextBtn" class="btn w-full bg-blue-600 text-white py-3 rounded-lg font-semibold text-lg mb-3" disabled>
          <i class="fa-solid fa-arrow-right"></i> CALL NEXT CUSTOMER
        </button>
        <button id="resetBtn" class="btn w-full bg-red-50 text-red-600 border border-red-200 py-3 rounded-lg font-semibold">
          <i class="fa-solid fa-rotate-left"></i> RESET QUEUE — Start from MAG-1
        </button>
      </div>
      <div class="lg:col-span-2 bg-white rounded-xl p-5 shadow-sm border border-slate-100">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-semibold text-lg">Queue List</h3>
          <div class="flex gap-3">
            <button id="clearBtn" class="text-slate-500 text-sm">Clear All</button>
          </div>
        </div>
        <table class="w-full text-sm">
          <thead><tr class="text-left text-slate-500 border-b">
            <th class="pb-2">#</th><th class="pb-2">Token</th><th class="pb-2">Name</th><th class="pb-2">Service</th><th class="pb-2"></th>
          </tr></thead>
          <tbody id="queueBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <div id="addModal" class="modal-overlay">
    <div class="bg-white rounded-xl p-6 w-full max-w-md mx-4 shadow-2xl">
      <h3 class="text-lg font-bold mb-4">Add New Customer</h3>
      <div class="space-y-3">
        <input type="text" id="inpName" placeholder="Full Name" class="w-full border rounded-lg px-3 py-2" />
        <select id="inpDept" class="w-full border rounded-lg px-3 py-2">
          <option>Customer Service</option>
          <option>Accounts</option>
          <option>Payments</option>
        </select>
        <input type="text" id="inpService" placeholder="Service" value="General Inquiry" class="w-full border rounded-lg px-3 py-2" />
      </div>
      <div class="flex gap-3 mt-5">
        <button id="btnCancel" class="flex-1 py-2 border rounded-lg">Cancel</button>
        <button id="btnSave" class="flex-1 py-2 bg-blue-600 text-white rounded-lg">Add to Queue</button>
      </div>
      <p id="modalNote" class="mt-3 text-sm"></p>
    </div>
  </div>
  <script>
    const SUPABASE_URL = "https://jvyrnzlrklydeaevjqry.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2eXJuemxya2x5ZGVhZXZqcXJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTUzNzIsImV4cCI6MjEwNTUzMTM3Mn0.vqIiba18j22PrMy-ye6OuzBSbngwWF-TPfo3JRPGI3E";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let selectedCounter = 1;
    let tokenOffset = 0;
    
    const modal = document.getElementById("addModal");
    function openModal() {
      modal.classList.add("active");
      document.getElementById("inpName").value = "";
      document.getElementById("modalNote").textContent = "";
      setTimeout(() => document.getElementById("inpName").focus(), 50);
    }
    function closeModal() { modal.classList.remove("active"); }
    document.getElementById("addCustomerBtn").addEventListener("click", openModal);
    document.getElementById("btnCancel").addEventListener("click", closeModal);
    document.getElementById("btnSave").addEventListener("click", saveCustomer);
    document.getElementById("clearBtn").addEventListener("click", clearAll);
    document.getElementById("resetBtn").addEventListener("click", resetQueue);

    // Counter Selection
    const btnCounter1 = document.getElementById("btnCounter1");
    const btnCounter2 = document.getElementById("btnCounter2");
    function selectCounter(num) {
      selectedCounter = num;
      if (num === 1) {
        btnCounter1.classList.add("active", "border-blue-600");
        btnCounter1.classList.remove("bg-slate-50", "border-slate-200");
        btnCounter2.classList.remove("active", "border-blue-600");
        btnCounter2.classList.add("bg-slate-50", "border-slate-200");
      } else {
        btnCounter2.classList.add("active", "border-blue-600");
        btnCounter2.classList.remove("bg-slate-50", "border-slate-200");
        btnCounter1.classList.remove("active", "border-blue-600");
        btnCounter1.classList.add("bg-slate-50", "border-slate-200");
      }
    }
    btnCounter1.addEventListener("click", () => selectCounter(1));
    btnCounter2.addEventListener("click", () => selectCounter(2));

    // Get Next Token
    async function getNextToken() {
      const { data: q } = await sb.from("queue").select("token");
      const { data: c } = await sb.from("calls").select("token");
      
      let max = 0;
      const allTokens = [...(q||[]), ...(c||[])];
      allTokens.forEach(r => {
        const num = parseInt(r.token.replace("MAG-", ""), 10);
        if (!isNaN(num) && num > max) max = num;
      });
      
      const nextNum = tokenOffset > 0 ? tokenOffset : (max + 1);
      if (tokenOffset > 0) tokenOffset = 0;
      
      return `MAG-${nextNum}`;
    }

    async function saveCustomer() {
      const name = document.getElementById("inpName").value.trim();
      const dept = document.getElementById("inpDept").value;
      const service = document.getElementById("inpService").value.trim() || "General Inquiry";
      const note = document.getElementById("modalNote");
      
      if (!name) {
        note.textContent = "⚠️ Enter a name first";
        note.style.color = "red";
        return;
      }
      
      try {
        const token = await getNextToken();
        const { count } = await sb.from("queue").select("*", { count: "exact", head: true });
        
        const { error } = await sb.from("queue").insert({
          token, name, dept, service, position: (count || 0) + 1
        });
        
        if (error) throw error;
        note.textContent = `✅ Added: ${name} — Token ${token}`;
        note.style.color = "green";
        setTimeout(closeModal, 800);
      } catch (err) {
        note.textContent = `❌ ${err.message}`;
        note.style.color = "red";
      }
    }

    // Call Next — moves previous to finished
    document.getElementById("callNextBtn").addEventListener("click", async () => {
      try {
        // Mark current as finished
        const { data: currentServing } = await sb
          .from("calls")
          .select("id")
          .eq("status", "serving")
          .limit(1);
        
        if (currentServing && currentServing.length > 0) {
          await sb
            .from("calls")
            .update({ status: "finished" })
            .eq("id", currentServing[0].id);
        }
        // Get next from queue
        const { data: nextInQueue, error: queueErr } = await sb
          .from("queue")
          .select("*")
          .order("position", { ascending: true })
          .limit(1);
        
        if (queueErr) throw queueErr;
        if (!nextInQueue || nextInQueue.length === 0) {
          alert("No customers in queue!");
          return;
        }
        const nextPerson = nextInQueue[0];
        await sb.from("queue").delete().eq("id", nextPerson.id);
        
        // Send to selected counter
        const { error: insertErr } = await sb.from("calls").insert({
          token: nextPerson.token,
          name: nextPerson.name,
          service: nextPerson.service,
          counter: selectedCounter,
          status: "serving"
        });
        if (insertErr) {
          alert("Database Error: " + insertErr.message);
          return;
        }
      } catch (err) {
        alert("Error: " + err.message);
      }
    });

    // Reset Queue
    async function resetQueue() {
      if (!confirm("⚠️ RESET ALL?\n\nClear queue + history → Start from MAG-1 again.\nThis cannot be undone!")) {
        return;
      }
      try {
        await sb.from("queue").delete().neq("id", 0);
        await sb.from("calls").delete().neq("id", 0);
        tokenOffset = 1;
        alert("✅ Queue Reset Complete!\n\nNext customer = MAG-1");
        load();
      } catch (err) {
        alert("❌ Reset Error: " + err.message);
      }
    }

    // ✅ Load & Render — includes Recently Served
    async function load() {
      const { data: q } = await sb.from("queue").select("*").order("position");
      const { data: s } = await sb.from("calls").select("*").eq("status","serving").limit(1);
      // Get last 5 finished — newest first
      const { data: finished } = await sb
        .from("calls")
        .select("*")
        .eq("status","finished")
        .order("id", { ascending: false })
        .limit(5);
      
      // Waiting count & button
      document.getElementById("waitingCount").textContent = q?.length || 0;
      document.getElementById("callNextBtn").disabled = !q?.length;
      
      // Queue list
      const body = document.getElementById("queueBody");
      body.innerHTML = "";
      if (q && q.length > 0) {
        q.forEach((row, i) => {
          body.innerHTML += `<tr class="border-b"><td class="py-2">${i+1}</td><td class="py-2"><span class="token-badge">${row.token}</span></td><td class="py-2">${row.name}</td><td class="py-2">${row.service}</td><td class="py-2 text-red-500 cursor-pointer" data-id="${row.id}">✕</td></tr>`;
        });
        body.querySelectorAll("[data-id]").forEach(b => {
          b.addEventListener("click", async () => {
            if (confirm("Remove this customer?")) {
              await sb.from("queue").delete().eq("id", b.dataset.id);
            }
          });
        });
      }
      
      // Now Serving
      if (s?.length) {
        document.getElementById("nowServing").textContent = `${s[0].token} — ${s[0].name}`;
      } else {
        document.getElementById("nowServing").textContent = "None";
      }
      
      // ✅ Recently Served List
      const servedList = document.getElementById("recentlyServedList");
      if (finished && finished.length > 0) {
        servedList.innerHTML = finished.map(row => `
          <div class="served-item">
            <p class="font-semibold text-sm">${row.token}</p>
            <p class="text-xs text-slate-500">${row.name} · Counter ${row.counter}</p>
          </div>
        `).join("");
      } else {
        servedList.innerHTML = '<p class="text-slate-400 text-sm py-4 text-center">No one served yet</p>';
      }
    }

    async function clearAll() {
      if (!confirm("Clear waiting customers only?")) return;
      await sb.from("queue").delete().neq("id", 0);
    }

    // Realtime updates
    sb.channel("q")
      .on("postgres_changes", { event: "*", schema: "public", table: "queue" }, load)
      .on("postgres_changes", { event: "*", schema: "public", table: "calls" }, load)
      .subscribe();

    (async () => {
      try {
        await sb.from("queue").select("*").limit(1);
        document.getElementById("connStatus").textContent = "✅ Connected to Supabase";
        document.getElementById("connStatus").style.color = "green";
      } catch (e) {
        document.getElementById("connStatus").textContent = "❌ Connection failed: " + e.message;
        document.getElementById("connStatus").style.color = "red";
      }
      load();
    })();
  </script>
</body>
</html>
