<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAGCOOP DAVAO — QUEUE CONTROL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563eb',
            dark: '#0f172a',
            accent: '#f59e0b',
            loan: '#a855f7',
            encoding: '#22c55e'
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      min-height: 100vh;
    }
    .token-badge {
      background: #ecfdf3;
      color: #065f46;
      font-family: monospace;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 1rem;
      letter-spacing: 0.05em;
    }
    .token-badge.loan {
      background: #faf5ff;
      color: #6b21a8;
    }
    .service-tag-enc {
      background: #dcfce7;
      color: #166534;
    }
    .service-tag-loan {
      background: #f3e8ff;
      color: #6b21a8;
    }
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      display: none; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .modal-overlay.active { display: flex; }
    .counter-btn { 
      transition: all 0.2s ease;
      cursor: pointer;
      pointer-events: auto;
    }
    .counter-btn.active { 
      background: #2563eb; 
      color: white; 
      border-color: #2563eb; 
    }
    .served-item { border-bottom: 1px solid #f1f5f9; padding: 6px 0; }
    .served-item:last-child { border-bottom: none; }
    button { cursor: pointer; pointer-events: auto; }
    
    /* ✅ FIXED SIZE — NEVER CHANGES */
    .queue-container {
      height: 480px;
      display: flex;
      flex-direction: column;
    }
    .queue-scroll-container {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 #f8fafc;
      min-height: 0;
    }
    .queue-scroll-container::-webkit-scrollbar {
      width: 6px;
    }
    .queue-scroll-container::-webkit-scrollbar-track {
      background: #f8fafc;
      border-radius: 3px;
    }
    .queue-scroll-container::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    .queue-scroll-container::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    thead th {
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
      box-shadow: 0 1px 0 #e2e8f0;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen p-4 md:p-6">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-white">
        <span style="color:#f5ce00">MAGCOOP</span> DAVAO — QUEUE CONTROL
      </h1>
      <p class="text-sm mt-1 text-green-300" id="connStatus">✅ Connected — Ready</p>
    </div>
    <!-- Stats Row -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-xl p-4 shadow-sm text-center">
        <p class="text-sm text-slate-500">📋 Encoding Waiting</p>
        <p class="text-3xl font-bold text-encoding mt-1" id="encWaiting">0</p>
      </div>
      <div class="bg-white rounded-xl p-4 shadow-sm text-center">
        <p class="text-sm text-slate-500">💰 Loan Waiting</p>
        <p class="text-3xl font-bold text-loan mt-1" id="loanWaiting">0</p>
      </div>
      <div class="bg-white rounded-xl p-4 shadow-sm text-center">
        <p class="text-sm text-slate-500">📊 Total Waiting</p>
        <p class="text-3xl font-bold text-slate-700 mt-1" id="totalWaiting">0</p>
      </div>
      <div class="bg-white rounded-xl p-4 shadow-sm text-center">
        <p class="text-sm text-slate-500">🔢 Next to Call</p>
        <p class="text-xl font-bold text-primary mt-1" id="nextToCall">—</p>
      </div>
    </div>
    <!-- Main Control Area -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Left: Controls -->
      <div class="bg-white rounded-xl shadow-sm p-5">
        <h3 class="font-semibold text-lg mb-3">Counter Control</h3>
        
        <div class="grid grid-cols-2 gap-3 mb-4">
          <button id="btnCounter1" class="counter-btn py-3 rounded-lg font-semibold border-2 border-slate-200 bg-slate-50">
            Counter 1
          </button>
          <button id="btnCounter2" class="counter-btn active py-3 rounded-lg font-semibold border-2 border-blue-600">
            Counter 2
          </button>
        </div>
        <!-- Now Serving -->
        <div class="bg-slate-50 rounded-lg p-4 mb-4">
          <p class="text-sm text-slate-500 mb-1">Now Serving</p>
          <p class="text-xl font-bold" id="nowServing">None</p>
          <p class="text-sm text-slate-500 mt-1" id="servingCounter"></p>
        </div>
        <!-- Action Buttons -->
        <button id="callNextBtn" class="w-full bg-primary hover:bg-primary/90 text-white py-3 rounded-lg font-bold text-lg mb-2 transition" disabled>
          <i class="fa-solid fa-bell"></i> CALL NEXT IN QUEUE
        </button>
        <button id="callAgainBtn" class="w-full bg-accent hover:bg-accent/90 text-white py-2 rounded-lg font-semibold mb-2 transition" disabled>
          <i class="fa-solid fa-volume-high"></i> RE-CALL CURRENT
        </button>
        <button id="addCustomerBtn" class="w-full bg-encoding/10 hover:bg-encoding/20 text-encoding py-2 rounded-lg font-semibold mb-2 transition">
          <i class="fa-solid fa-user-plus"></i> ADD CUSTOMER
        </button>
        <button id="resetBtn" class="w-full bg-red-50 hover:bg-red-100 text-red-600 py-2 rounded-lg font-semibold text-sm border border-red-200 transition">
          <i class="fa-solid fa-rotate-left"></i> RESET ALL QUEUES
        </button>
        <div class="mt-4 pt-4 border-t">
          <button onclick="window.open('public-display.html','_blank')" class="w-full bg-slate-50 hover:bg-slate-100 py-2 rounded-lg text-sm">
            <i class="fa-solid fa-tv"></i> Open Public Display
          </button>
        </div>
      </div>
      <!-- Right: Full Queue List -->
      <div class="md:col-span-2 bg-white rounded-xl shadow-sm p-5 queue-container">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-semibold text-lg">📋 Full Queue — Call #1 First</h3>
          <button id="clearAllBtn" class="text-red-500 text-sm hover:text-red-700">Clear All</button>
        </div>
        
        <div class="queue-scroll-container">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b text-slate-500">
                <th class="py-2 w-16">#</th>
                <th class="py-2 w-28">Token</th>
                <th class="py-2">Name</th>
                <th class="py-2 w-24">Type</th>
                <th class="py-2 w-16"></th>
              </tr>
            </thead>
            <tbody id="queueBody">
              <tr>
                <td colspan="5" class="py-8 text-center text-slate-400">No customers in queue</td>
              </tr>
            </tbody>
          </table>
        </div>
        
        <div class="mt-4 pt-4 border-t flex-shrink-0">
          <h4 class="font-semibold text-sm text-slate-500 mb-2">Recently Served</h4>
          <div id="recentlyServed" class="max-h-24 overflow-y-auto text-sm">
            <p class="text-slate-400">None yet</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Add Customer Modal -->
  <div id="addModal" class="modal-overlay">
    <div class="bg-white rounded-xl p-6 w-full max-w-md mx-4 shadow-2xl">
      <h3 class="text-lg font-bold mb-4">Add New Customer</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Name</label>
          <input type="text" id="inpName" placeholder="Full Name" class="w-full border rounded-lg px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Service Type</label>
          <select id="inpService" class="w-full border rounded-lg px-3 py-2">
            <option value="Encoding">Encoding</option>
            <option value="MAGCOOP Loan">Loan</option>
          </select>
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button id="btnCancel" class="flex-1 py-2 border rounded-lg">Cancel</button>
        <button id="btnSave" class="flex-1 py-2 bg-primary text-white rounded-lg font-semibold">Add to Queue</button>
      </div>
      <p id="modalMsg" class="mt-3 text-sm"></p>
    </div>
  </div>
  <script>
    const SUPABASE_URL = "https://jvyrnzlrklydeaevjqry.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2eXJuemxya2x5ZGVhZXZqcXJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTUzNzIsImV4cCI6MjEwNTUzMTM3Mn0.vqIiba18j22PrMy-ye6OuzBSbngwWF-TPfo3JRPGI3E";
    
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let selectedCounter = 2;
    let tokenOffsets = { Encoding: 0, "MAGCOOP Loan": 0 };
    let currentServing = null;
    
    // Elements
    const btnCounter1 = document.getElementById('btnCounter1');
    const btnCounter2 = document.getElementById('btnCounter2');
    const callNextBtn = document.getElementById('callNextBtn');
    const callAgainBtn = document.getElementById('callAgainBtn');
    const addCustomerBtn = document.getElementById('addCustomerBtn');
    const resetBtn = document.getElementById('resetBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const addModal = document.getElementById('addModal');
    const btnCancel = document.getElementById('btnCancel');
    const btnSave = document.getElementById('btnSave');
    
    // ✅ Counter selection
    btnCounter1.addEventListener('click', () => {
      selectedCounter = 1;
      btnCounter1.classList.add('active', 'border-blue-600', 'bg-white');
      btnCounter1.classList.remove('bg-slate-50', 'border-slate-200');
      btnCounter2.classList.remove('active', 'border-blue-600');
      btnCounter2.classList.add('bg-slate-50', 'border-slate-200');
    });
    btnCounter2.addEventListener('click', () => {
      selectedCounter = 2;
      btnCounter2.classList.add('active', 'border-blue-600', 'bg-white');
      btnCounter2.classList.remove('bg-slate-50', 'border-slate-200');
      btnCounter1.classList.remove('active', 'border-blue-600');
      btnCounter1.classList.add('bg-slate-50', 'border-slate-200');
    });
    
    // Generate next token
    async function getNextToken(service) {
      const [{ data: q }, { data: c }] = await Promise.all([
        sb.from('queue').select('token').eq('service', service),
        sb.from('calls').select('token').eq('service', service)
      ]);
      let max = 0;
      [...(q||[]), ...(c||[])].forEach(r => {
        const match = r.token.match(/^[EL](\d+)$/);
        if (match) {
          const num = parseInt(match[1], 10);
          if (num > max) max = num;
        }
      });
      const nextNum = tokenOffsets[service] > 0 ? tokenOffsets[service] : (max + 1);
      if (tokenOffsets[service] > 0) tokenOffsets[service] = 0;
      return (service === 'MAGCOOP Loan' ? 'L' : 'E') + String(nextNum).padStart(3, '0');
    }
    
    // Open/Close Modal
    addCustomerBtn.addEventListener('click', () => {
      addModal.classList.add('active');
      document.getElementById('inpName').value = '';
      document.getElementById('modalMsg').textContent = '';
      setTimeout(() => document.getElementById('inpName').focus(), 50);
    });
    btnCancel.addEventListener('click', () => addModal.classList.remove('active'));
    
    // Save Customer
    btnSave.addEventListener('click', async () => {
      const name = document.getElementById('inpName').value.trim();
      const service = document.getElementById('inpService').value;
      
      if (!name) {
        document.getElementById('modalMsg').textContent = '⚠️ Enter a name';
        document.getElementById('modalMsg').style.color = 'red';
        return;
      }
      try {
        const token = await getNextToken(service);
        
        const { data: allQ } = await sb.from('queue').select('position').order('position', { ascending: false }).limit(1);
        const nextPos = allQ && allQ.length > 0 ? (allQ[0].position || 0) + 1 : 1;
        
        await sb.from('queue').insert({
          token,
          name,
          service,
          position: nextPos,
          dept: service === 'MAGCOOP Loan' ? 'Loans' : 'Customer Service'
        });
        document.getElementById('modalMsg').textContent = `✅ Added: ${token} — ${name}`;
        document.getElementById('modalMsg').style.color = 'green';
        setTimeout(() => addModal.classList.remove('active'), 800);
      } catch (err) {
        document.getElementById('modalMsg').textContent = '❌ ' + err.message;
        document.getElementById('modalMsg').style.color = 'red';
      }
    });
    
    // ✅ CALL NEXT — Person is REMOVED from queue list → appears in Now Serving
    callNextBtn.addEventListener('click', async () => {
      try {
        // Mark previous as finished
        if (currentServing && currentServing.id) {
          await sb.from('calls').update({ status: 'finished' }).eq('id', currentServing.id);
        }
        
        // Get the NEXT person waiting in queue
        const { data: nextInQueue } = await sb.from('queue')
          .select('*')
          .order('position', { ascending: true })
          .limit(1);
          
        if (!nextInQueue || nextInQueue.length === 0) {
          alert('✅ Queue is empty!');
          return;
        }
        
        const nextPerson = nextInQueue[0];
        
        // ✅ REMOVE from waiting queue — so they DON'T appear in the list anymore
        await sb.from('queue').delete().eq('id', nextPerson.id);
        
        // ✅ ADD to calls table as "Now Serving"
        await sb.from('calls').delete().eq('service', nextPerson.service);
        
        const { data: servingRecord } = await sb.from('calls').insert({
          token: nextPerson.token,
          name: nextPerson.name,
          service: nextPerson.service,
          counter: selectedCounter,
          status: 'serving'
        }).select();
        
        if (servingRecord && servingRecord.length > 0) {
          currentServing = servingRecord[0];
          callAgainBtn.disabled = false;
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });
    
    // ✅ RE-CALL CURRENT
    callAgainBtn.addEventListener('click', async () => {
      if (!currentServing) return;
      
      try {
        const savedToken = currentServing.token;
        const savedName = currentServing.name;
        const savedService = currentServing.service;
        const savedCounter = currentServing.counter;
        
        if (currentServing.id) {
          await sb.from('calls').update({ status: 'finished' }).eq('id', currentServing.id);
        }
        
        await new Promise(resolve => setTimeout(resolve, 150));
        
        const { data: newServing } = await sb.from('calls').insert({
          token: savedToken,
          name: savedName,
          service: savedService,
          counter: savedCounter,
          status: 'serving'
        }).select();
        
        if (newServing && newServing.length > 0) {
          currentServing = newServing[0];
        } else {
          currentServing = {
            token: savedToken,
            name: savedName,
            service: savedService,
            counter: savedCounter
          };
        }
      } catch (err) {
        console.error('Re-call error:', err);
        alert('Re-call failed: ' + err.message);
      }
    });
    
    // Reset All
    resetBtn.addEventListener('click', async () => {
      if (!confirm('⚠️ RESET ALL QUEUES?\n\nEncoding starts at E001\nLoan starts at L001\nAll history cleared!')) return;
      
      await Promise.all([
        sb.from('queue').delete().neq('service', ''),
        sb.from('calls').delete().neq('service', '')
      ]);
      
      tokenOffsets.Encoding = 1;
      tokenOffsets['MAGCOOP Loan'] = 1;
      currentServing = null;
      callAgainBtn.disabled = true;
      alert('✅ ALL RESET — Add customers now!');
    });
    
    // Clear All Waiting
    clearAllBtn.addEventListener('click', async () => {
      if (!confirm('⚠️ Remove ALL waiting customers?')) return;
      await sb.from('queue').delete().neq('service', '');
    });
    
    // ✅ Load / Refresh — Now Serving ≠ Queue List
    async function load() {
      try {
        // Queue = ONLY people WAITING (not yet called)
        let { data: queue, error: qErr } = await sb.from('queue').select('*').order('position', { ascending: true });
        // Serving = person CURRENTLY being called
        const { data: serving, error: sErr } = await sb.from('calls').select('*').eq('status', 'serving').limit(1);
        const { data: recent, error: rErr } = await sb.from('calls').select('*').eq('status', 'finished').order('id', { ascending: false }).limit(5);
        
        if (qErr) console.error('Queue load error:', qErr);
        if (sErr) console.error('Serving load error:', sErr);
        if (rErr) console.error('Recent load error:', rErr);
        
        queue = queue || [];
        
        // Auto-fix positions
        let needsFix = false;
        queue.forEach((item, idx) => {
          if (item.position !== idx + 1) needsFix = true;
        });
        if (needsFix) {
          for (let i = 0; i < queue.length; i++) {
            if (queue[i].position !== i + 1) {
              await sb.from('queue').update({ position: i + 1 }).eq('id', queue[i].id);
              queue[i].position = i + 1;
            }
          }
        }
        
        const encList = queue.filter(r => r.service === 'Encoding');
        const loanList = queue.filter(r => r.service === 'MAGCOOP Loan');
        
        document.getElementById('encWaiting').textContent = encList.length;
        document.getElementById('loanWaiting').textContent = loanList.length;
        document.getElementById('totalWaiting').textContent = queue.length;
        
        // ✅ "Next to Call" = FIRST person still WAITING in queue
        if (queue.length > 0) {
          document.getElementById('nextToCall').textContent = queue[0].token;
          callNextBtn.disabled = false;
        } else {
          document.getElementById('nextToCall').textContent = '—';
          callNextBtn.disabled = true;
        }
        
        // ✅ "Now Serving" = person from calls table (separate from queue)
        if (serving && serving.length > 0) {
          currentServing = serving[0];
          document.getElementById('nowServing').textContent = `${serving[0].token} — ${serving[0].name}`;
          document.getElementById('servingCounter').textContent = `Counter ${serving[0].counter}`;
          callAgainBtn.disabled = false;
        } else {
          currentServing = null;
          document.getElementById('nowServing').textContent = 'None';
          document.getElementById('servingCounter').textContent = '';
          callAgainBtn.disabled = true;
        }
        
        // ✅ Queue list = ONLY WAITING people — NEVER shows the one being served
        const body = document.getElementById('queueBody');
        if (queue.length === 0) {
          body.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400">No customers in queue</td></tr>`;
        } else {
          body.innerHTML = queue.map((r, idx) => `
            <tr class="border-b ${idx === 0 ? 'bg-primary/5 font-semibold' : ''}">
              <td class="py-3">${idx + 1}</td>
              <td class="py-3">
                <span class="token-badge ${r.service === 'MAGCOOP Loan' ? 'loan' : ''}">${r.token}</span>
              </td>
              <td class="py-3">${r.name}</td>
              <td class="py-3">
                <span class="px-2 py-1 rounded-full text-xs ${r.service === 'MAGCOOP Loan' ? 'service-tag-loan' : 'service-tag-enc'}">
                  ${r.service === 'MAGCOOP Loan' ? 'Loan' : 'Encoding'}
                </span>
              </td>
              <td class="py-3 text-red-500 cursor-pointer hover:text-red-700" data-id="${r.id}">✕</td>
            </tr>
          `).join('');
          
          body.querySelectorAll('[data-id]').forEach(el => {
            el.addEventListener('click', async () => {
              if (confirm('Remove this customer?')) {
                await sb.from('queue').delete().eq('id', el.dataset.id);
              }
            });
          });
        }
        
        const servedDiv = document.getElementById('recentlyServed');
        if (!recent || recent.length === 0) {
          servedDiv.innerHTML = '<p class="text-slate-400">None yet</p>';
        } else {
          servedDiv.innerHTML = recent.map(r => `
            <div class="served-item">
              <p class="font-semibold">${r.token} — ${r.name}</p>
              <p class="text-xs text-slate-500">${r.service} · Counter ${r.counter}</p>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error('Load error:', err);
      }
    }
    
    // Realtime updates
    sb.channel('queue-updates')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'queue' }, load)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'calls' }, load)
      .subscribe();
    
    // Init
    (async () => {
      try {
        await sb.from('queue').select('*').limit(1);
        document.getElementById('connStatus').textContent = '✅ Connected — Ready';
        document.getElementById('connStatus').style.color = '#86efac';
      } catch {
        document.getElementById('connStatus').textContent = '❌ Not Connected';
        document.getElementById('connStatus').style.color = '#fca5a5';
      }
      load();
    })();
  </script>
</body>
</html>
