<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magcoop Portal - Encoding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 
            primary: '#0b3d91',
            magcoop: {
              blue: '#0b3d91',
              yellow: '#f5ce00',
              green: '#22c55e'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      background: linear-gradient(135deg, #0b3d91 0%, #1e50b8 100%); 
      min-height: 100vh;
    }
    .btn { cursor: pointer; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .token-badge { 
      background: #e6f0ff; 
      color: #0b3d91; 
      font-family: monospace; 
      font-weight: 600; 
      padding: 4px 10px; 
      border-radius: 6px; 
      font-size: 1rem;
      letter-spacing: 0.05em;
    }
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      display: none; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .modal-overlay.active { display: flex; }
    .counter-btn { transition: all 0.2s ease; }
    .counter-btn.active { background: #0b3d91; color: white; border-color: #0b3d91; }
    .served-item { border-bottom: 1px solid #f1f5f9; padding: 6px 0; }
    .served-item:last-child { border-bottom: none; }
  </style>
</head>
<body class="text-slate-800 min-h-screen p-6">
  <div class="max-w-7xl mx-auto">
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-white flex items-center gap-2">
        <span class="text-magcoop-blue bg-white px-3 py-1 rounded">MAG</span>
        <span class="text-magcoop-yellow bg-white px-3 py-1 rounded">COOP</span>
        <span class="text-white ml-2">Portal - Encoding</span>
      </h1>
      <p class="text-sm mt-1 text-blue-100" id="connStatus">Checking connection...</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-12 gap-5 mb-6">
      <!-- Recently Served -->
      <div class="md:col-span-4 bg-white rounded-xl p-5 shadow-sm border border-slate-100">
        <p class="text-sm text-slate-500 mb-3"><i class="fa-regular fa-clock"></i> Recently Served — Encoding</p>
        <div id="recentlyServedList" class="max-h-48 overflow-y-auto">
          <p class="text-slate-400 text-sm py-4 text-center">No one served yet</p>
        </div>
      </div>
      <!-- Quick Stats -->
      <div class="md:col-span-4 bg-white rounded-xl p-5 shadow-sm border border-slate-100">
        <h3 class="font-semibold text-slate-700 mb-4">Quick Stats</h3>
        <div class="text-center">
          <p class="text-3xl font-bold text-magcoop-blue" id="waitingCount">0</p>
          <p class="text-xs text-slate-500">Encoding Waiting</p>
        </div>
      </div>
      <!-- Quick Actions -->
      <div class="md:col-span-4 bg-white rounded-xl p-5 shadow-sm border border-slate-100">
        <h3 class="font-semibold text-slate-700 mb-3">Quick Actions</h3>
        <div class="grid grid-cols-1 gap-2">
          <button id="addCustomerBtn" class="btn bg-magcoop-blue hover:bg-blue-800 text-white rounded-lg p-3 text-sm flex flex-col items-center gap-1">
            <i class="fa-solid fa-user-plus"></i> Add Encoding Customer
          </button>
          <button onclick="window.open('public-display.html', '_blank')" class="btn bg-slate-50 hover:bg-slate-100 rounded-lg p-3 text-sm flex flex-col items-center gap-1">
            <i class="fa-solid fa-desktop"></i> Open Public Display
          </button>
          <button onclick="window.open('head-loan.html', '_blank')" class="btn bg-magcoop-yellow hover:bg-yellow-400 text-slate-800 rounded-lg p-3 text-sm flex flex-col items-center gap-1">
            <i class="fa-solid fa-landmark"></i> 📋 Open Loan Counter
          </button>
        </div>
      </div>
    </div>
    <!-- Queue Section -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
      <div class="grid grid-cols-1 lg:col-span-3 gap-6">
        <!-- Counter Controls -->
        <div class="lg:col-span-1">
          <h3 class="font-semibold text-lg mb-2">Counter Selection</h3>
          <p class="text-sm text-slate-500 mb-4">Encoding customers only</p>
          
          <div class="grid grid-cols-2 gap-3 mb-4">
            <button id="btnCounter1" class="counter-btn active py-3 rounded-lg font-semibold border-2 border-magcoop-blue">
              Counter 1
            </button>
            <button id="btnCounter2" class="counter-btn bg-slate-50 py-3 rounded-lg font-semibold border-2 border-slate-200">
              Counter 2
            </button>
          </div>
          
          <div class="bg-blue-50 rounded-lg p-4 mb-4">
            <p class="text-xs text-magcoop-blue uppercase mb-2">Currently Serving — Encoding</p>
            <p class="text-lg font-semibold text-magcoop-blue" id="nowServing">None</p>
            <p class="text-sm text-slate-500 mt-1" id="currentServiceLine"></p>
          </div>
          
          <button id="callNextBtn" class="btn w-full bg-magcoop-yellow hover:bg-yellow-400 text-slate-800 py-3 rounded-lg font-semibold text-lg mb-3" disabled>
            <i class="fa-solid fa-arrow-right"></i> CALL NEXT ENCODING
          </button>
          
          <button id="resetBtn" class="btn w-full bg-red-50 text-red-600 border border-red-200 py-3 rounded-lg font-semibold">
            <i class="fa-solid fa-rotate-left"></i> RESET ENCODING QUEUE
          </button>
        </div>
        <!-- Queue List -->
        <div class="lg:col-span-2">
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-semibold text-lg">Encoding Queue List</h3>
            <button id="clearBtn" class="text-slate-500 text-sm">Clear All</button>
          </div>
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left text-slate-500 border-b">
                <th class="pb-2">#</th>
                <th class="pb-2">Token</th>
                <th class="pb-2">Name</th>
                <th class="pb-2"></th>
              </tr>
            </thead>
            <tbody id="queueBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <!-- Add Customer Modal -->
  <div id="addModal" class="modal-overlay">
    <div class="bg-white rounded-xl p-6 w-full max-w-md mx-4 shadow-2xl">
      <h3 class="text-lg font-bold mb-4 text-magcoop-blue">Add Encoding Customer</h3>
      <div class="space-y-3">
        <input type="text" id="inpName" placeholder="Full Name" class="w-full border rounded-lg px-3 py-2" />
        <input type="text" value="Encoding" readonly class="w-full border rounded-lg px-3 py-2 bg-slate-50 text-slate-500" />
        <input type="hidden" id="inpService" value="Encoding" />
        <input type="hidden" id="inpDept" value="Customer Service" />
      </div>
      <div class="flex gap-3 mt-5">
        <button id="btnCancel" class="flex-1 py-2 border rounded-lg">Cancel</option>
        <button id="btnSave" class="flex-1 py-2 bg-magcoop-blue text-white rounded-lg">Add to Queue</button>
      </div>
      <p id="modalNote" class="mt-3 text-sm"></p>
    </div>
  </div>
  <script>
    const SUPABASE_URL = "https://jvyrnzlrklydeaevjqry.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2eXJuemxya2x5ZGVhZXZqcXJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NTUzNzIsImV4cCI6MjEwNTUzMTM3Mn0.vqIiba18j22PrMy-ye6OuzBSbngwWF-TPfo3JRPGI3E";
    
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let selectedCounter = 1;
    let tokenOffset = 0;
    const modal = document.getElementById("addModal");
    
    function formatEncodingToken(num) {
      return `E${String(num).padStart(3, '0')}`;
    }
    
    function openModal() {
      modal.classList.add("active");
      document.getElementById("inpName").value = "";
      document.getElementById("modalNote").textContent = "";
      setTimeout(() => document.getElementById("inpName").focus(), 50);
    }
    
    function closeModal() { modal.classList.remove("active"); }
    
    document.getElementById("addCustomerBtn").addEventListener("click", openModal);
    document.getElementById("btnCancel").addEventListener("click", closeModal);
    document.getElementById("btnSave").addEventListener("click", saveCustomer);
    document.getElementById("clearBtn").addEventListener("click", clearAll);
    document.getElementById("resetBtn").addEventListener("click", resetQueue);
    
    const btnCounter1 = document.getElementById("btnCounter1");
    const btnCounter2 = document.getElementById("btnCounter2");
    
    function selectCounter(num) {
      selectedCounter = num;
      if (num === 1) {
        btnCounter1.classList.add("active", "border-magcoop-blue");
        btnCounter1.classList.remove("bg-slate-50", "border-slate-200");
        btnCounter2.classList.remove("active", "border-magcoop-blue");
        btnCounter2.classList.add("bg-slate-50", "border-slate-200");
      } else {
        btnCounter2.classList.add("active", "border-magcoop-blue");
        btnCounter2.classList.remove("bg-slate-50", "border-slate-200");
        btnCounter1.classList.remove("active", "border-magcoop-blue");
        btnCounter1.classList.add("bg-slate-50", "border-slate-200");
      }
    }
    
    btnCounter1.addEventListener("click", () => selectCounter(1));
    btnCounter2.addEventListener("click", () => selectCounter(2));
    
    async function getNextToken() {
      const [{ data: q }, { data: c }] = await Promise.all([
        sb.from("queue").select("token").eq("service", "Encoding"),
        sb.from("calls").select("token").eq("service", "Encoding")
      ]);
      
      let max = 0;
      [...(q||[]), ...(c||[])].forEach(r => {
        let num;
        if (r.token.startsWith("E")) {
          num = parseInt(r.token.replace("E", ""), 10);
        } else {
          num = parseInt(r.token.replace("MAG-", ""), 10);
        }
        if (!isNaN(num) && num > max) max = num;
      });
      
      const nextNum = tokenOffset > 0 ? tokenOffset : (max + 1);
      if (tokenOffset > 0) tokenOffset = 0;
      return formatEncodingToken(nextNum);
    }
    
    async function saveCustomer() {
      const name = document.getElementById("inpName").value.trim();
      if (!name) {
        document.getElementById("modalNote").textContent = "⚠️ Enter a name first";
        document.getElementById("modalNote").style.color = "red";
        return;
      }
      
      try {
        const token = await getNextToken();
        const { count } = sb.from("queue").select("*", { count: "exact", head: true }).eq("service", "Encoding");
        
        await sb.from("queue").insert({
          token, name, dept: "NAME", dept: "Customer Service", service: "Encoding", position: (count || 0) + 1
        });
        
        document.getElementById("modalNote").textContent = `✅ Added: ${name} — ${token}`;
        document.getElementById("modalNote").style.color = "green";
        setTimeout(closeModal, 800);
      } catch (err) {
        document.getElementById("modalNote").textContent = `❌ ${err.message}`;
        document.getElementById("modalNote").style.color = "red";
      }
    }
    
    document.getElementById("callNextBtn").addEventListener("click", async () => {
      try {
        const { data: prev } = await sb.from("calls").select("id").eq("status", "serving").neq("service", "MAGCOOP Loan").limit(1);
        if (prev?.length) await sb.from("calls").update({ status: "finished" }).eq("id", prev[0].id);
        const { data: next } = await sb.from("queue").select("*").eq("service", "Encoding").order("position").limit(1);
        if (!next?.length) { alert("No Encoding customers in queue!"); return; }
        
        const person = next[0];
        await sb.from("queue").delete().eq("id", person.id);
        await sb.from("calls").insert({
          token: person.token,
          name: person.name,
          service: "Encoding",
          counter: selectedCounter,
          status: "serving"
        });
      } catch (err) { alert("Error: " + err.message); }
    });
    
    async function resetQueue() {
      if (!confirm("⚠️ Reset Encoding Queue only?\nLoan queue will NOT be affected.\n\nNext Encoding = E001")) return;
      await sb.from("queue").delete().eq("service", "Encoding");
      await sb.from("calls").delete().eq("service", "Encoding");
      tokenOffset = 1;
      alert("✅ Encoding Reset — Next = E001");
      load();
    }
    
    async function load() {
      const [{ data: q }, { data: serving }, { data: done }] = await Promise.all([
        sb.from("queue").select("*").eq("service", "Encoding").order("position"),
        sb.from("calls").select("*").eq("status", "serving").neq("service", "MAGCOOP Loan").limit(1),
        sb.from("calls").select("*").eq("service", "Encoding").eq("status", "finished").order("id", { ascending: false }).limit(5)
      ]);
      document.getElementById("waitingCount").textContent = q?.length || 0;
      document.getElementById("callNextBtn").disabled = !q?.length;
      
      const body = document.getElementById("queueBody");
      if (!q?.length) {
        body.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-slate-400">No Encoding customers waiting</td></tr>`;
      } else {
        body.innerHTML = q.map((r, i) => `
          <tr class="border-b">
            <td class="py-2">${i+1}</td>
            <td class="py-2"><span class="token-badge">${r.token}</td>
            <td class="py-2">${r.name}</td>
            <td class="py-2 text-red-500 cursor-pointer" data-id="${r.id}">✕</td>
          </tr>`).join("");
        body.querySelectorAll("[data-id]").forEach(b => {
          b.addEventListener("click", async () => {
            if (confirm("Remove?")) await sb.from("queue").delete().eq("id", b.dataset.id);
          });
        });
      }
      
      if (serving?.length) {
        document.getElementById("nowServing").textContent = `${serving[0].token} — ${serving[0].name}`;
        document.getElementById("currentServiceLine").textContent = `Counter ${serving[0].counter}`;
      } else {
        document.getElementById("nowServing").textContent = "None";
        document.getElementById("currentServiceLine").textContent = "";
      }
      
      const list = document.getElementById("recentlyServedList");
      if (!done?.length) {
        list.innerHTML = `<p class="text-slate-400 text-sm py-4 text-center">No one served yet</p>`;
      } else {
        list.innerHTML = done.map(r => `
          <div class="served-item">
            <p class="font-semibold text-sm">${r.token}</p>
            <p class="text-xs text-slate-500">${r.name} · Counter ${r.counter}</p>
          </div>`).join("");
      }
    }
    
    async function clearAll() {
      if (!confirm("Clear all Encoding customers?")) return;
      await sb.from("queue").delete().eq("service", "Encoding");
    }
    
    sb.channel("q")
      .on("postgres_changes", { event: "*", schema: "public", table: "queue" }, load)
      .on("postgres_changes", { event: "*", schema: "public", table: "calls" }, load)
      .subscribe();
    
    (async () => {
      try {
        await sb.from("queue").select("*").limit(1);
        document.getElementById("connStatus").textContent = "✅ Connected";
        document.getElementById("connStatus").style.color = "green";
      } catch (e) {
        document.getElementById("connStatus").textContent = "❌ Connection failed";
      }
      load();
    })();
  </script>
</body>
</html>
